<style>

ax(95px,1fr) minmax(170px,1.35fr) auto;gap:8px;align-items:end;padding:13px 0;border-bottom:1px solid #1d2731}.row:last-child{border:0}.row>div{min-width:0}.row label{display:block;margin:0 0 6px 2px}.subtitle{margin-top:3px}.field-title{margin:0 0 6px 2px}input,select{width:100%;padding:11px 12px;border:1px solid #2b3743;border-radius:12px;background:#0b1117;color:#f3f4f6;outline:0}input:focus,select:focus{border-color:#1680ff;box-shadow:0 0 0 3px #1680ff20}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.cableMini{border:1px solid #26313c;border-radius:10px;background:#151d25;color:#cbd5df;padding:7px 10px;font-size:12px;white-space:nowrap}.cableIntro{margin:-7px 2px 14px;line-height:1.45}.cableList{display:flex;flex-direction:column;gap:10px}.cableCard{width:100%;display:flex;align-items:center;gap:13px;padding:14px;color:#fff;text-align:left}.cableCard.selected{border-color:#1677ff;background:linear-gradient(180deg,#111d2a,#0d151d)}.cableIcon{width:46px;height:46px;border-radius:14px;background:#151d25;border:1px solid #2b3743;display:grid;place-items:center;font-weight:850;font-size:17px;flex:none}.cableIcon.utp4{color:#60a5fa}.cableIcon.utp2{color:#f97316}.cableIcon.shvvp{color:#a78bfa}.cableIcon.kspv{color:#d1d5db}.cableInfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.cableInfo b{font-size:16px}.cableInfo small{color:#7f8b98;font-size:12px}.check{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#1677ff;color:#fff;font-weight:800}.colorview{min-height:43px;min-width:0;padding:9px 10px;border:1px solid #25313d;border-radius:12px;background:#0b1117;display:flex;align-items:center;gap:8px;font-size:15px;white-space:nowrap;overflow:hidden}.colorText{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.swatch{display:inline-block;width:44px;height:18px;border:1px solid #53606c;border-radius:3px;flex:none}.swatch.orange{background:#f97316!important}.swatch.green{background:#22c55e!important}.swatch.blue{background:#3b82f6!important}.swatch.brown{background:#92400e!important}.swatch.white{background:#fff!important}.swatch.white-orange{background:repeating-linear-gradient(90deg,#fff 0 11px,#f97316 11px 19px,#fff 19px 30px,#f97316 30px 38px,#fff 38px 44px)!important}.swatch.white-green{background:repeating-linear-gradient(90deg,#fff 0 11px,#22c55e 11px 19px,#fff 19px 30px,#22c55e 30px 38px,#fff 38px 44px)!important}.swatch.white-blue{background:repeating-linear-gradient(90deg,#fff 0 11px,#3b82f6 11px 19px,#fff 19px 30px,#3b82f6 30px 38px,#fff 38px 44px)!important}.swatch.white-brown{background:repeating-linear-gradient(90deg,#fff 0 11px,#92400e 11px 19px,#fff 19px 30px,#92400e 30px 38px,#fff 38px 44px)!important}.rowButtons{display:flex;gap:5px;flex:none}.edit,.del{height:43px;border:1px solid #26313c;border-radius:11px;background:#151d25;color:#e5e7eb}.edit{padding:0 10px;font-size:12px}.del{width:40px;color:#8b96a3;font-size:19px}.empty{text-align:center;padding:42px 18px}.empty.small{padding:28px 10px}.add{width:100%;margin-top:13px}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#e9eef5;color:#0a0f14;padding:10px 15px;border-radius:11px;opacity:0;transition:.2s;z-index:20}.toast.show{opacity:1}.login{margin-top:15vh}.login h1{margin:8px 0}.login input{margin-top:7px;margin-bottom:0}.login .primary{margin-top:13px}.plug{font-size:38px}.error{margin-top:12px;text-align:center;min-height:18px}.hidden{display:none!important}.addDevice{margin-top:13px}
@media(max-width:500px){#app{padding-left:12px;padding-right:12px}.row{grid-template-columns:minmax(82px,1fr) minmax(0,1.35fr) auto;gap:7px}.colorview{font-size:14px;padding-left:8px;padding-right:7px}.edit{padding:0 9px}.cableCard{padding:13px}.sectionHead{align-items:flex-start}}
</style>
</head>
<body><div id="app"></div><div id="toast" class="toast"></div><script src="app.js"></script><script>
/* После успешной авторизации не выбрасываем пользователя на экран пароля,
   если облачная синхронизация временно недоступна. */
window.loginScreen=function(message=''){
  app.innerHTML=`<div class="card login"><div class="plug">🔌</div><h1>Схемы расключения</h1><p class="muted">Введите пароль для доступа к общей базе схем.</p><label>Пароль</label><input id="password" type="password" placeholder="Пароль" autocomplete="current-password"><button class="primary" id="loginButton">Войти</button><div id="loginError" class="muted error">${esc(message)}</div></div>`;
  const password=document.getElementById('password');
  const button=document.getElementById('loginButton');
  const error=document.getElementById('loginError');
  async function go(){
    if(!password.value.trim()){error.textContent='Введите пароль.';return;}
    button.disabled=true; button.textContent='Входим…'; error.textContent='';
    try{
      await login(password.value);
      try{ await syncPending(); }catch(e){ console.warn('sync after login',e); }
      try{ await pullCloud(); }catch(e){ console.warn('cloud load after login',e); toast('Вход выполнен, но база пока недоступна'); }
      render();
    }catch(e){
      button.disabled=false; button.textContent='Войти';
      error.textContent=!navigator.onLine?'Нет интернета для первого входа.':(e?.message||'Не удалось войти.');
    }
  }
  button.onclick=go; password.onkeydown=e=>{if(e.key==='Enter')go()}; password.focus();
};
</script><script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body>
