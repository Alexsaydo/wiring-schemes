<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Расключение"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon.svg"><title>Схемы расключения</title><style>*{box-sizing:border-box}body{margin:0;background:#070b10;color:#f3f4f6;font:16px system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}#app{max-width:720px;min-height:100vh;margin:auto;padding:18px 14px 34px}.header{display:flex;align-items:center;gap:12px;margin-bottom:20px}.header h1{font-size:24px;margin:0;flex:1;font-weight:800}.card,.device{background:linear-gradient(180deg,#111820,#0d141b);border:1px solid #1c2732;border-radius:17px;box-shadow:0 10px 28px #0003}.card{padding:16px;margin-bottom:13px}.device{width:100%;display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;color:#fff;text-align:left}.device:active{background:#151e27}.icon{width:42px;height:42px;border-radius:13px;background:#1677ff;display:grid;place-items:center;flex:none}.name{flex:1;font-weight:750}.muted,.field-title{color:#8b96a3;font-size:13px}.chev{color:#697583;font-size:25px}.primary,.secondary,.danger{border-radius:12px;padding:11px 14px;font-weight:700}.primary{width:100%;border:0;background:#1677ff;color:#fff;padding:14px}.secondary{border:1px solid #26313c;background:#151d25;color:#e5e7eb}.danger{border:1px solid #3a2025;background:#181216;color:#ff5b67}.back{width:42px;height:42px;border:1px solid #26303b;border-radius:13px;background:#111820;color:#fff;font-size:28px}.actions{display:flex;gap:8px;margin-bottom:13px}.actions>*{flex:1}.row{display:grid;grid-template-columns:1fr 1.15fr auto;gap:8px;align-items:end;padding:11px 0;border-bottom:1px solid #1d2731}.row:last-child{border:0}.field-title{margin:0 0 6px 2px}input,select{width:100%;padding:11px 12px;border:1px solid #2b3743;border-radius:12px;background:#0b1117;color:#f3f4f6;outline:0}input:focus,select:focus{border-color:#1680ff;box-shadow:0 0 0 3px #1680ff20}.colorview{min-height:43px;padding:11px 12px;border:1px solid #25313d;border-radius:12px;background:#0b1117;display:flex;align-items:center}.swatch{display:inline-block;width:25px;height:13px;border:1px solid #53606c;border-radius:3px;margin-right:8px}.rowbuttons{display:flex;gap:5px}.edit,.del{height:43px;border:1px solid #26313c;border-radius:11px;background:#151d25;color:#e5e7eb}.edit{padding:0 10px;font-size:12px}.del{width:40px;color:#8b96a3;font-size:19px}.empty{text-align:center;padding:42px 18px}.add{width:100%;margin-top:13px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#e9eef5;color:#0a0f14;padding:10px 15px;border-radius:11px;opacity:0;transition:.2s}.toast.show{opacity:1}.login{margin-top:15vh}.login h1{margin:8px 0}.login input{margin-top:7px}.login .primary{margin-top:13px}@media(max-width:500px){.row{grid-template-columns:1fr 1.15fr auto}input,select{font-size:16px}}</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>const URL="https://icenlyttjymkuhudocqm.supabase.co",KEY="sb_publishable_3-YQ35kD_JOBz_5g1JYTuA_r0b3_QdY",EMAIL="andreev.bu@gmail.com",AK="wiring-auth",LK="wiring-local";let auth=read(AK),devices=read(LK)||[],current=null,timer;const COLORS=[['white-orange','Бело-оранжевый','#f97316'],['orange','Оранжевый','#f97316'],['white-green','Бело-зелёный','#22c55e'],['green','Зелёный','#22c55e'],['white-blue','Бело-синий','#3b82f6'],['blue','Синий','#3b82f6'],['white-brown','Бело-коричневый','#92400e'],['brown','Коричневый','#92400e']];function read(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1400)}async function api(path,opt={}){let h={apikey:KEY,'Content-Type':'application/json',...(opt.headers||{})};if(auth?.access_token)h.Authorization='Bearer '+auth.access_token;let r=await fetch(URL+path,{...opt,headers:h}),d=null;try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d?.msg||d?.message||d?.error_description||'Ошибка');return d}async function login(p){auth=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:EMAIL,password:p})});write(AK,auth)}async function pull(){if(!auth?.access_token||!navigator.onLine)return;devices=await api('/rest/v1/devices?select=id,name,contacts,created_at,updated_at&order=created_at.asc');write(LK,devices)}async function sync(d){if(!auth?.access_token||!navigator.onLine)return;try{if(String(d.id).startsWith('local-')){let r=await api('/rest/v1/devices',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({name:d.name,contacts:d.contacts})});Object.assign(d,r[0]||{})}else await api('/rest/v1/devices?id=eq.'+encodeURIComponent(d.id),{method:'PATCH',body:JSON.stringify({name:d.name,contacts:d.contacts,updated_at:new Date().toISOString()})});write(LK,devices);toast('Синхронизировано')}catch(e){console.warn(e)}}function save(d){write(LK,devices);clearTimeout(timer);timer=setTimeout(()=>sync(d),350)}function loginPage(){app.innerHTML='<div class="card login"><div style="font-size:38px">🔌</div><h1>Схемы расключения</h1><p class="muted">Введите пароль для доступа к общей базе схем.</p><div class="field-title">Пароль</div><input id="pw" type="password" placeholder="Пароль" autocomplete="current-password"><button class="primary" id="go">Войти</button><div id="err" class="muted" style="margin-top:12px;text-align:center"></div></div>';go.onclick=async()=>{if(!pw.value)return err.textContent='Введите пароль.';err.textContent='Входим…';try{await login(pw.value);await pull();render()}catch(e){err.textContent='Неверный пароль или нет соединения.'}};pw.onkeydown=e=>e.key==='Enter'&&go.click()}function home(){app.innerHTML='<div class="header"><h1>Схемы расключения</h1></div>'+(devices.length?devices.map(d=>`<button class="device" data-id="${esc(d.id)}"><span class="icon">⌁</span><span class="name">${esc(d.name)}</span><span class="muted">${d.contacts.length} контактов</span><span class="chev">›</span></button>`).join(''):'<div class="card empty"><div style="font-size:40px">🔌</div><h2>Пока ничего нет</h2><p class="muted">Добавьте первое устройство и его схему расключения.</p></div>')+'<button class="primary" id="new">＋ Новое устройство</button>';document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>{current=x.dataset.id;render()});new.onclick=()=>{let n=prompt('Введите название устройства:');if(!n?.trim())return;let d={id:'local-'+id(),name:n.trim(),contacts:[]};devices.push(d);save(d);current=d.id;render()}}function editor(){let d=devices.find(x=>x.id===current);if(!d){current=null;return render()}app.innerHTML=`<div class="header"><button class="back" id="back">‹</button><h1>${esc(d.name)}</h1></div><div class="actions"><button class="secondary" id="rename">✎ Переименовать</button><button class="danger" id="remove">Удалить</button></div><div class="card"><b>Расключение</b><div class="muted">Контакт → цвет жилы UTP</div>${d.contacts.length?d.contacts.map((r,i)=>row(r,i)).join(''):'<div class="empty" style="padding:28px 10px"><span class="muted">Контактов пока нет.</span></div>'}<button class="secondary add" id="add">＋ Добавить контакт</button></div>`;back.onclick=()=>{current=null;render()};rename.onclick=()=>{let n=prompt('Новое название:',d.name);if(n?.trim()){d.name=n.trim();save(d);render()}};remove.onclick=async()=>{if(!confirm('Удалить устройство и его схему?'))return;try{if(!String(d.id).startsWith('local-'))await api('/rest/v1/devices?id=eq.'+encodeURIComponent(d.id),{method:'DELETE'})}catch(e){}devices=devices.filter(x=>x!==d);write(LK,devices);current=null;render()};add.onclick=()=>{d.contacts.push({contact:'',colorId:''});save(d);render()};document.querySelectorAll('.contact').forEach(x=>x.oninput=()=>{d.contacts[+x.dataset.i].contact=x.value;save(d)});document.querySelectorAll('.edit').forEach(x=>x.onclick=()=>{let i=+x.dataset.i,s=document.querySelector('.sel[data-i="'+i+'"]');s.style.display='block';document.querySelector('.cv[data-i="'+i+'"]')?.style.setProperty('display','none');s.focus()});document.querySelectorAll('.sel').forEach(x=>x.onchange=()=>{d.contacts[+x.dataset.i].colorId=x.value;save(d);render()});document.querySelectorAll('.del').forEach(x=>x.onclick=()=>{d.contacts.splice(+x.dataset.i,1);save(d);render()})}function row(r,i){let opts=COLORS.map(c=>`<option value="${c[0]}" ${c[0]===r.colorId?'selected':''}>${c[1]}</option>`).join(''),c=COLORS.find(x=>x[0]===r.colorId),shown=c?`<span class="swatch" style="background:${c[2]}"></span>${esc(c[1])}`:'Не выбран';return `<div class="row"><div><div class="field-title">Контакт</div><input class="contact" data-i="${i}" value="${esc(r.contact)}" placeholder="Например: GND"></div><div><div class="field-title">Цвет UTP</div>${c?`<div class="colorview cv" data-i="${i}">${shown}</div><select class="sel" data-i="${i}" style="display:none"><option value="">Выберите цвет</option>${opts}</select>`:`<select class="sel" data-i="${i}"><option value="">Выберите цвет</option>${opts}</select>`}</div><div class="rowbuttons">${c?`<button class="edit" data-i="${i}">ред.</button>`:''}<button class="del" data-i="${i}">×</button></div></div>`}function render(){auth?.access_token?(current?editor():home()):loginPage()}async function boot(){if(auth?.access_token&&navigator.onLine)try{await pull()}catch(e){}render()}boot();window.addEventListener('online',()=>auth?.access_token&&pull().then(render));if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
