<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Расключение">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>Схемы расключения</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b10;color:#f3f4f6;font:16px system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}#app{max-width:760px;min-height:100vh;margin:auto;padding:18px 14px 34px}.header{display:flex;align-items:center;gap:12px;margin-bottom:20px}.header h1{font-size:24px;margin:0;flex:1;font-weight:800}.cloud{color:#45d483}.card,.device{background:linear-gradient(180deg,#111820,#0d141b);border:1px solid #1c2732;border-radius:17px;box-shadow:0 10px 28px #0003}.card{padding:16px;margin-bottom:13px}.device{width:100%;display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;color:#fff;text-align:left}.device:active{background:#151e27}.icon{width:42px;height:42px;border-radius:13px;background:#1677ff;display:grid;place-items:center;flex:none}.name{flex:1;font-weight:750}.muted,label{color:#8b96a3;font-size:13px}.count{color:#8b96a3;font-size:12px}.chev{color:#697583;font-size:25px}.primary,.secondary,.danger{border-radius:12px;padding:11px 14px;font-weight:700}.primary{width:100%;border:0;background:#1677ff;color:#fff;padding:14px}.primary:disabled{opacity:.65}.secondary{border:1px solid #26313c;background:#151d25;color:#e5e7eb}.danger{border:1px solid #3a2025;background:#181216;color:#ff5b67}.back{width:42px;height:42px;border:1px solid #26303b;border-radius:13px;background:#111820;color:#fff;font-size:28px}.actions{display:flex;gap:8px;margin-bottom:13px}.actions>*{flex:1}.row{display:grid;grid-template-columns:minmax(95px,1fr) minmax(170px,1.35fr) auto;gap:8px;align-items:end;padding:13px 0;border-bottom:1px solid #1d2731}.row:last-child{border:0}.row label{display:block;margin:0 0 6px 2px}.subtitle{margin-top:3px}.field-title{margin:0 0 6px 2px}input,select{width:100%;padding:11px 12px;border:1px solid #2b3743;border-radius:12px;background:#0b1117;color:#f3f4f6;outline:0}input:focus,select:focus{border-color:#1680ff;box-shadow:0 0 0 3px #1680ff20}.colorview{min-height:43px;padding:9px 10px;border:1px solid #25313d;border-radius:12px;background:#0b1117;display:flex;align-items:center;gap:7px;font-size:15px;white-space:nowrap}.swatch{display:inline-block;width:28px;height:14px;border:1px solid #53606c;border-radius:3px;flex:none}.rowButtons{display:flex;gap:5px}.edit,.del{height:43px;border:1px solid #26313c;border-radius:11px;background:#151d25;color:#e5e7eb}.edit{padding:0 10px;font-size:12px}.del{width:40px;color:#8b96a3;font-size:19px}.empty{text-align:center;padding:42px 18px}.empty.small{padding:28px 10px}.add{width:100%;margin-top:13px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#e9eef5;color:#0a0f14;padding:10px 15px;border-radius:11px;opacity:0;transition:.2s}.toast.show{opacity:1}.login{margin-top:15vh}.login h1{margin:8px 0}.login input{margin-top:7px;margin-bottom:0}.login .primary{margin-top:13px}.plug{font-size:38px}.error{margin-top:12px;text-align:center;min-height:18px}.hidden{display:none!important}.addDevice{margin-top:13px}
@media(max-width:500px){#app{padding-left:12px;padding-right:12px}.row{grid-template-columns:minmax(82px,1fr) minmax(155px,1.35fr) auto;gap:7px}.colorview{font-size:14px;padding-left:8px;padding-right:7px}.edit{padding:0 9px}}
</style>
</head>
<body><div id="app"></div><div id="toast" class="toast"></div><script src="app.js"></script><script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body>
</html>
