<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Расключение"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon.svg"><title>Схемы расключения</title></head><body><div id="app"></div><script>const SUPABASE_URL="https://icenlyttjymkuhudocqm.supabase.co",SUPABASE_KEY="sb_publishable_3-YQ35kD_JOBz_5g1JYTuA_r0b3_QdY",SUPABASE_LOGIN_EMAIL="andreev.bu@gmail.com";let auth=null,devices=[],currentDeviceId=null;const AK="wiring-auth",LK="wiring-local";function read(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}auth=read(AK);devices=read(LK)||[];function esc(s){return String(s??"").replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function authHeaders(extra={}){let h={apikey:SUPABASE_KEY,"Content-Type":"application/json",...extra};if(auth?.access_token)h.Authorization="Bearer "+auth.access_token;return h}async function api(path,opt={}){let r=await fetch(SUPABASE_URL+path,{...opt,headers:authHeaders(opt.headers||{})}),d=null;try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d?.msg||d?.message||d?.error_description||"Ошибка");return d}async function login(password){auth=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:SUPABASE_LOGIN_EMAIL,password})});write(AK,auth)}async function pull(){if(!auth?.access_token||!navigator.onLine)return;devices=await api("/rest/v1/devices?select=id,name,contacts,created_at,updated_at&order=created_at.asc");write(LK,devices)}async function push(d){if(!auth?.access_token||!navigator.onLine)return;if(String(d.id).startsWith("local-")){let r=await api("/rest/v1/devices",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({name:d.name,contacts:d.contacts})});Object.assign(d,r[0]||{})}else await api("/rest/v1/devices?id=eq."+encodeURIComponent(d.id),{method:"PATCH",body:JSON.stringify({name:d.name,contacts:d.contacts,updated_at:new Date().toISOString()})});write(LK,devices)}function save(d){write(LK,devices);if(navigator.onLine)push(d).catch(console.warn)}function authPage(){app.innerHTML='<main><h1>🔌 Схемы расключения</h1><p>Введите пароль для доступа к общей базе схем.</p><input id="password" type="password" placeholder="Пароль"><button id="loginBtn">Войти</button><p id="status"></p></main>';loginBtn.onclick=async()=>{status.textContent="Входим…";try{await login(password.value);await pull();render()}catch(e){status.textContent="Неверный пароль или ошибка соединения."}};password.onkeydown=e=>{if(e.key==="Enter")loginBtn.click()}}function home(){app.innerHTML='<main><h1>Схемы расключения</h1>'+(devices.length?devices.map(d=>`<button class="device" data-id="${esc(d.id)}">🔌 <b>${esc(d.name)}</b><span>${d.contacts.length} контактов ›</span></button>`).join(""):"<p>Пока ничего нет.</p>")+'<button id="newDevice">＋ Новое устройство</button></main>';document.querySelectorAll("[data-id]").forEach(x=>x.onclick=()=>{currentDeviceId=x.dataset.id;render()});newDevice.onclick=()=>{let n=prompt("Введите название устройства:");if(!n?.trim())return;let d={id:"local-"+Date.now(),name:n.trim(),contacts:[]};devices.push(d);save(d);currentDeviceId=d.id;render()}}function editor(){let d=devices.find(x=>x.id===currentDeviceId);if(!d){currentDeviceId=null;return render()}app.innerHTML=`<main><button id="back">‹</button><h1>${esc(d.name)}</h1><button id="rename">Переименовать</button><button id="deleteDevice">Удалить</button><h3>Расключение</h3>${d.contacts.map((r,i)=>`<div class="row"><input class="contact" data-i="${i}" value="${esc(r.contact||"")}" placeholder="Контакт"><select class="color" data-i="${i}"><option value="">Выберите цвет</option>${["Бело-оранжевый","Оранжевый","Бело-зелёный","Зелёный","Бело-синий","Синий","Бело-коричневый","Коричневый"].map(c=>`<option ${c===r.color?'selected':''}>${c}</option>`).join("")}</select><button class="del" data-i="${i}">×</button></div>`).join("")}<button id="addContact">＋ Добавить контакт</button></main>`;back.onclick=()=>{currentDeviceId=null;render()};rename.onclick=()=>{let n=prompt("Новое название:",d.name);if(n?.trim()){d.name=n.trim();save(d);render()}};deleteDevice.onclick=async()=>{if(!confirm("Удалить устройство и его схему?"))return;if(!String(d.id).startsWith("local-"))await api("/rest/v1/devices?id=eq."+encodeURIComponent(d.id),{method:"DELETE"});devices=devices.filter(x=>x!==d);write(LK,devices);currentDeviceId=null;render()};addContact.onclick=()=>{d.contacts.push({contact:"",color:""});save(d);render()};document.querySelectorAll(".contact").forEach(x=>x.oninput=()=>{d.contacts[+x.dataset.i].contact=x.value;save(d)});document.querySelectorAll(".color").forEach(x=>x.onchange=()=>{d.contacts[+x.dataset.i].color=x.value;save(d);render()});document.querySelectorAll(".del").forEach(x=>x.onclick=()=>{d.contacts.splice(+x.dataset.i,1);save(d);render()})}function render(){if(!auth?.access_token)return authPage();currentDeviceId?editor():home()}async function boot(){if(auth?.access_token&&navigator.onLine){try{await pull()}catch(e){}}render()}boot();window.addEventListener("online",()=>auth?.access_token&&pull().then(render));</script></body></html>
