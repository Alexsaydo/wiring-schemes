<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b10">
  <title>Новый пароль — Схемы расключения</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070b10;color:#eef2f7}body{padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);display:flex;justify-content:center;align-items:center}.card{width:min(520px,100%);background:#101820;border:1px solid #263543;border-radius:24px;padding:28px;box-shadow:0 18px 60px #0008}.plug{font-size:42px;margin-bottom:10px}h1{font-size:28px;margin:0 0 10px}p{color:#94a3b8;line-height:1.45}label{display:block;color:#94a3b8;margin:20px 0 7px}input{width:100%;height:54px;border-radius:15px;border:1px solid #2a3b4a;background:#080e14;color:#eef2f7;font-size:18px;padding:0 15px;outline:none}input:focus{border-color:#4b6479}button{width:100%;height:54px;margin-top:18px;border:0;border-radius:15px;background:#e8edf3;color:#101820;font-size:17px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.msg{margin-top:16px;min-height:24px;color:#94a3b8}.error{color:#ff6875}.ok{color:#62d39a}.back{display:inline-block;margin-top:14px;color:#94a3b8;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="plug">🔐</div>
    <h1>Новый пароль</h1>
    <p>Задайте новый пароль для общей базы схем.</p>
    <label for="p1">Новый пароль</label>
    <input id="p1" type="password" autocomplete="new-password" placeholder="Введите пароль">
    <label for="p2">Повторите пароль</label>
    <input id="p2" type="password" autocomplete="new-password" placeholder="Повторите пароль">
    <button id="save">Сохранить пароль</button>
    <div id="msg" class="msg"></div>
    <a class="back" href="./">← Вернуться в приложение</a>
  </main>
<script>
const SUPABASE_URL='https://icenlyttjymkuhudocqm.supabase.co';
const SUPABASE_KEY='sb_publishable_3-YQ35kD_JOBz_5g1JYTuA_r0b3_QdY';
const msg=document.getElementById('msg'), btn=document.getElementById('save');
function say(t,c=''){msg.className='msg '+c;msg.textContent=t}
function token(){const p=new URLSearchParams(location.hash.slice(1));return p.get('access_token')}
async function reset(){
  const t=token();
  if(!t){say('Ссылка восстановления недействительна или уже истекла.','error');btn.disabled=true;return}
  const p1=document.getElementById('p1').value, p2=document.getElementById('p2').value;
  if(p1.length<6){say('Пароль должен быть не короче 6 символов.','error');return}
  if(p1!==p2){say('Пароли не совпадают.','error');return}
  btn.disabled=true;btn.textContent='Сохраняем…';say('');
  try{
    const r=await fetch(SUPABASE_URL+'/auth/v1/user',{method:'PUT',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({password:p1})});
    let d=null;try{d=await r.json()}catch(e){}
    if(!r.ok)throw new Error(d?.message||d?.msg||'Не удалось изменить пароль');
    say('Пароль изменён. Сейчас вернёмся в приложение.','ok');
    setTimeout(()=>location.href='./',900);
  }catch(e){btn.disabled=false;btn.textContent='Сохранить пароль';say(e.message||'Ошибка. Попробуйте запросить письмо ещё раз.','error')}
}
btn.onclick=reset;
</script>
</body>
</html>
